name: NWBL Eyes Agent

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to screenshot, usually the Vercel preview or production URL"
        required: false
        type: string
  push:
    branches:
      - work
  deployment_status:
  repository_dispatch:
    types:
      - vercel.deployment.success

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  screenshot-site:
    name: Capture website screenshots
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ github.event.inputs.base_url || github.event.client_payload.url || github.event.deployment_status.target_url || github.event.deployment_status.environment_url || 'https://nwbl-eco-2.vercel.app' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright only for Eyes Agent
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Wait briefly for deployment edge propagation
        run: sleep 20

      - name: Validate target URL
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL is empty. Use workflow_dispatch with base_url or trigger from Vercel deployment event."
            exit 1
          fi
          echo "NWBL Eyes Agent target: $BASE_URL"

      - name: Capture visual QA screenshots
        id: capture
        continue-on-error: true
        run: npx playwright test tests/nwbl-eyes-agent.spec.ts --reporter=list

      - name: Upload screenshot report
        id: upload_screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nwbl-eyes-agent-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Create Eyes Agent GitHub report
        if: always()
        uses: actions/github-script@v7
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CAPTURE_STATUS: ${{ steps.capture.outcome }}
          ARTIFACT_ID: ${{ steps.upload_screenshots.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_screenshots.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_screenshots.outputs.artifact-digest }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const target = process.env.BASE_URL;
            const status = process.env.CAPTURE_STATUS;
            const sha = context.sha;
            const branch = context.ref.replace('refs/heads/', '');
            const artifactId = process.env.ARTIFACT_ID || 'not available';
            const artifactUrl = process.env.ARTIFACT_URL || `${runUrl}#artifacts`;
            const artifactDigest = process.env.ARTIFACT_DIGEST || 'not available';
            const artifactApiUrl = artifactId !== 'not available'
              ? `https://api.github.com/repos/${owner}/${repo}/actions/artifacts/${artifactId}/zip`
              : 'not available';
            const title = `NWBL Eyes Agent Courier Report - ${new Date().toISOString()}`;
            const body = [
              `# NWBL Eyes Agent Courier Report`,
              ``,
              `**Target URL:** ${target}`,
              `**Workflow run:** ${runUrl}`,
              `**Artifact name:** \`nwbl-eyes-agent-screenshots\``,
              `**Artifact ID:** ${artifactId}`,
              `**Artifact download page:** ${artifactUrl}`,
              `**Artifact API ZIP URL:** ${artifactApiUrl}`,
              `**Artifact digest:** ${artifactDigest}`,
              `**Capture status:** ${status}`,
              `**Branch:** ${branch}`,
              `**Commit:** ${sha}`,
              ``,
              `## Expected artifact contents`,
              ``,
              `- \`desktop-home-full.png\``,
              `- \`mobile-home-full.png\``,
              `- \`mobile-hero-viewport.png\``,
              `- \`desktop-hero-viewport.png\``,
              `- \`diagnostics.json\``,
              ``,
              `## Courier instructions`,
              ``,
              `1. Open the artifact download page above.`,
              `2. Download \`nwbl-eyes-agent-screenshots\`.`,
              `3. Hand the ZIP, artifact ID, or workflow run link to Puka for inspection.`,
              ``,
              `This issue was created automatically by the NWBL Eyes Agent Reporter + Artifact Courier layer.`
            ].join('\n');

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['eyes-agent', 'visual-qa', 'automated-report', 'artifact-courier']
            });
